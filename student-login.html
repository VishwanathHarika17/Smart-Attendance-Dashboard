<!DOCTYPE html>
<html lang="en">

<head>

    <title>Student Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>
        <h1>Smart Attendance Dashboard</h1>
    </header>


    <main>

        <div class="login-container">

            <h2>Student Login</h2>

            <form id="studentLoginForm">

                <label for="studentId">
                    Student ID:
                </label>

                <input
                    type="text"
                    id="studentId"
                    name="studentId"
                    placeholder="Enter Student ID"
                    required
                >

                <br><br>


                <label for="password">
                    Password:
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >

                <br><br>


                <button type="button" id="studentLogin">
                    Login
                </button>

            </form>


            <br>


            <a href="index.html">
                Back to Home
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
