<!DOCTYPE html>
<html lang="en">

<head>
    <title>Faculty Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Smart Attendance Dashboard</h1>
    </header>

    <main>

        <div class="login-container">

            <h2>Faculty Login</h2>

            <form>

                <label for="facultyId">Faculty ID:</label>

                <input type="text" id="facultyId" name="facultyId" placeholder="Enter Faculty ID">

                <br><br>

                <label for="password">Password:</label>

                <input type="password" id="facultyPassword" name="facultyPassword" placeholder="Enter Password">
               
                <br><br>

                <button type="button" id="facultyLogin">Login</button>
            </form>

            <br>

            <a href="index.html">Back to Home</a>

        </div>

    </main>
  <script src="script.js"></script>
</body>

</html>
